<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background-color: #1a7be8;
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-box {
            background-color: #e9f0fb;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 80px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .login-box h2 { color: #0f3554; }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #080808;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background-color: #1580eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .login-box button:hover {
            background-color: #2a6daf;
        }

        .login-box p {
            margin-top: 15px;
            font-size: 14px;
        }
            
        
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form>
            <input type="email" placeholder="💌Email" required>
            <input type="password" placeholder="🔒Password" required>
            <button type="submit">Login</button>
            <p> Forget Pssword</p>
        </form>
    </div>
</body>
</html>
