<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;

            align-items: center;
            margin: 0;
            padding: 0;
        }

            color: #0a3d62;
            font-size: 40px;

        }

             margin: 21px auto;
            padding: 24px;
            border-radius: 8px;
            width: 70%;
            border: 1px solid #444;
            justify-content: center;
           
            text-align: start;
            font-size: 20px;
        }

        .prize {
            margin: 850px;
            color: #0a3d62;
            font-weight: bold;
            font-size: 20px;
        }

        
        
    </style>
</head>
<body>
    <div class="menu">
        <h1>🍴Restaurant Menu</h1>

        <div class="items">
            <span>Pizza</span>
            <span class="prize">₹199</span>
        </div>

        <div class="items">
            <span>Burger</span>
            <span class="prize">₹99</span>
        </div>

        <div class="items">
            <span>Pasta</span>
            <span class="prize">₹149</span>
        </div>

        <div class="items">
            <span>Sandwich</span>
            <span class="prize">₹79</span>
        </div>

        <div class="items">
            <span>Cold Drink</span>
            <span class="prize">₹50</span>
        </div>
    </div>
</body>
</html>
