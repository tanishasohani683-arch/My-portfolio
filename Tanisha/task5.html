<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skill bar</title>
    <style>
        .skill {
            width: 100%;
            background: rgb(231, 185, 185);
        }
        .HTML {
            width: 90%;
            background: rgb(231, 33, 33);
            color: aqua;
            text-align: center;
        }

        .CSS {
            width: 85%;
            background: rgb(86, 238, 40);
            color: aqua;
            text-align: center;
            border-radius: 30% 70%/50% 50%;
        }

        .PYTHON {
            width: 88%;
            background: rgb(108, 31, 231);
            color: aqua;
            text-align: center;
            border-radius: 10% 50% 10% 50%;
        }

        .JAVASCRIPT {
            width: 82%;
            background: rgb(231, 163, 16);
            color: aqua;
            text-align: center;
        }
    </style>
</head>
<body>
            <h1 class="my skills"></h1>
            <p>HTML</p>
            <div class="skill bar">
                <div class="HTML">90%</div>
            </div>

            <p>CSS</p>
            <div class="skill bar">
                <div class="CSS">82%</div>
            </div>

            <p>PYTHON</p>
            <div class="skill bar">
                <div class="PYTHON">75%</div>
            </div>

            <p>JAVASCRIPT</p>
            <div class="skill bar">
                <div class="JAVASCRIPT">65%</div>
            </div>
</body>
</html>
