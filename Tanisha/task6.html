<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2ff;
            margin: 0;
            padding: 20;
        }

        h1 {
            text-align: center;
            color: black;
        }

        .Pricing-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background-color: #eef3ff;
            border: 1px solid #aab;
            border-radius: 10px;
            width: 300px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0,1);
        }

        .card h2 {
            color: #1e3a8a;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
            margin: 20px 0;
        }

        .card p {
            color: #555;
            margin: 8px;
            font-size: 14px;
        }

        .card button {
            background-color: #3a8de0;
            color: white;
            border: none;
            padding: 10px 25px;
            margin-top: 15px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #2a6daf;
        }
    
    </style>

    
</head>
<body>
    <h1>Pricing Plans</h1>

    <div class="Pricing-container">

        <div class="card">
            <h2>Basic</h2>
            <div class="price">₹499</div>
            <p>5 Projects</p>
            <p>10 GB Storage</p>
            <button>Choose</button>
        </div>

        <div class="card">
            <h2>Standard</h2>
            <div class="price">₹999</div>
            <p>20 Projects</p>
            <p>50 GB Storage</p>
            <button>Choose</button>
        </div>
        
        <div class="card">
            <h2>Premium</h2>
            <div class="price">₹1999</div>
            <p>Unlimited Projects</p>
            <p>100 GB Storage</p>
            <button>Choose</button>
        </div>

            
    </div>
</body>
</html>
