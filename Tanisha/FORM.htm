<head>

</head>
<body>
    <h1>STUDENT REGISTRATION FORM</h1>
    <form>
        Name:
        <input type="text" name="name">

        <input type="email" name="email">

        <br><br>

        <input type="radio" name="gender">

        <input type="radio" name="gender">

    </form>

      
    </form>
