<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
    <style>
        body {
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 1001px;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        tr:nth-child(even) {
            background: #eee;
        }
    
    </style>
</head>
<body>
    <h1>College Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
            <th>12-1</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>Python</td>
            <td>Math</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>C++</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>English</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>Python</td>
            <td>Math</td>
            <td>C++</td>
            <td>HTML</td>
        </tr>
    </table>
</body>
</html>
